name: ci

# Runs on every pull request into main (and on pushes to main) so PRs have a required
# gate before merge. Fast, hermetic: the test suite is stdlib + pytest only (no AWS, no
# network) — it reads the templates/source as files and asserts structure.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests + template validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install test deps
        # cryptography is pinned in substrate/mcp-server/requirements.in and is REQUIRED by
        # tests/test_jwt_verification.py; without it pytest.importorskip silently skipped the
        # entire JWT verifier suite in CI.
        run: pip install --quiet pytest pyyaml cryptography cfn-lint

      - name: Run test suite
        # -rs prints skip reasons so a missing security dependency is visible, not silent.
        run: python -m pytest tests/ -q -rs

      - name: Run deploy/ops integration harnesses
        # These pass locally but were never invoked by CI (they are scripts, not pytest tests).
        run: |
          bash tests/test_deploy_rebind.sh
          bash tests/test_remove_cf.sh
          bash capsules/computer-use-desktop/tests/test_airgap.sh
          bash capsules/computer-use-desktop/tests/test_persistent_home.sh
          python substrate/mcp-server/test_recovery_image_id.py

      - name: Validate CloudFormation templates (cfn-lint, errors only)
        # Errors only: the templates intentionally carry advisory warnings (nodejs20 deprecation,
        # ALB egress, public NAT subnets) documented in SECURITY.md/findings.md.
        run: >
          cfn-lint --non-zero-exit-code error
          substrate/cloudformation/pairputer.yaml
          substrate/cloudformation/nested/*.yaml
          ci/pairputer-ci.yaml

      - name: Validate CloudFormation templates parse (with CFN intrinsics)
        run: |
          python - <<'PY'
          import glob, sys, yaml
          class L(yaml.SafeLoader):
              pass
          # Accept CloudFormation short-form intrinsics (!Ref, !Sub, !GetAtt, !If, ...) as opaque nodes.
          L.add_multi_constructor('!', lambda loader, suffix, node: None)
          files = sorted(
              glob.glob('substrate/cloudformation/**/*.yaml', recursive=True)
              + glob.glob('ci/*.yaml')
          )
          bad = 0
          for f in files:
              try:
                  yaml.load(open(f), Loader=L)
                  print(f"ok   {f}")
              except Exception as e:
                  bad += 1
                  print(f"FAIL {f}: {e}")
          sys.exit(1 if bad else 0)
          PY

      - name: Shellcheck every tracked shell script
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # -S error: fail only on errors (warnings are informational for this heredoc-heavy code).
          git ls-files '*.sh' | xargs shellcheck -S error
